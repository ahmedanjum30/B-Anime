[package]
name = "banime-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "banime_app_lib"
# cdylib: the Android library (Tauri loads it as a .so). rlib: what the desktop exe links.
# No staticlib: that's only for iOS, which B-Anime doesn't ship.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
banime-core = { path = "../../crates/core" }
chrono = "0.4.45"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Android: open the system installer for app updates (src/android_install.rs). Both are already
# in the build through Tauri.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8"
windows-registry = "0.6"
