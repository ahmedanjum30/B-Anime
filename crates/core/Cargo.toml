[package]
name = "banime-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
axum = "0.8.9"
base64 = "0.23.1"
cbc = "0.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
ego-tree = "0.11"
flate2 = "1.1.11"
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
md-5 = "0.10"
oxc = { version = "0.158.0", features = ["transformer", "codegen", "semantic"] }
png = "0.18.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "stream"] }
rquickjs = { version = "0.14.0", features = ["futures", "parallel", "macro", "loader"] }
# Firefox-fingerprinted fetch for extensions (import("mozillafetch")).
mozillafetch = { git = "https://github.com/ahmedanjum30/mozillaFetch", tag = "v0.2.0", features = ["quickjs"] }
scraper = { version = "0.29.0", features = ["atomic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
walkdir = "2.5.0"
