[package]
name = "banime-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
futures-util = "0.3.34"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "stream"] }
rquickjs = { version = "0.14.0", features = ["futures", "parallel", "macro"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
walkdir = "2.5.0"
