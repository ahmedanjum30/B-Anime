# Backend tests and a frontend type-check on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust (MSVC, from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # mozillafetch builds BoringSSL; NASM assembles its x86_64 assembly (cached with target/).
      - name: NASM (BoringSSL's x86_64 assembly)
        shell: pwsh
        run: |
          $v = "2.16.03"
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/$v/win64/nasm-$v-win64.zip" -OutFile "$env:RUNNER_TEMP\nasm.zip"
          Expand-Archive "$env:RUNNER_TEMP\nasm.zip" "$env:RUNNER_TEMP\nasm"
          "$env:RUNNER_TEMP\nasm\nasm-$v" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Backend tests
        run: cargo test -p banime-core
      - name: Frontend type-check and build
        working-directory: app
        run: |
          npm ci
          npm run build
