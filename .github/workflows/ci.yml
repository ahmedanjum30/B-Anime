# Backend tests and a frontend type-check on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Rust (MSVC, from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # mozillafetch builds BoringSSL; NASM assembles its x86_64 assembly (cached with target/).
      - uses: ilammy/setup-nasm@v1
      - name: Backend tests
        run: cargo test -p banime-core
      - name: Frontend type-check and build
        working-directory: app
        run: |
          npm ci
          npm run build
