# Builds the Windows installer and the Android APK and publishes a GitHub release when a version
# tag is pushed (scripts/release.ps1 does the bump, tag and push).
#
# Installed copies of B-Anime find the release, download their file (the setup on Windows, the
# APK on Android), check it against SHA256SUMS.txt, and offer to update.
#
# Optional Windows code signing: repository secrets WINDOWS_CERT_PFX (the .pfx file,
# base64-encoded) and WINDOWS_CERT_PASSWORD. Without them, the setup is unsigned.
#
# Android needs the release signing key, or the APK is skipped: repository secrets
# ANDROID_KEYSTORE (the .jks, base64-encoded), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.
# The same key must sign every release, or installed copies can't update.
name: Release

on:
  push:
    tags: ["v*"]
  # Run by hand on a branch to try the Android build without publishing anything (only the
  # android job runs; Windows, publish and pages need a version tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      BI_VERSION: v0.1.1
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $conf = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $conf) { throw "Tag v$tag doesn't match tauri.conf.json version $conf" }
          "VERSION=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust (MSVC, from rust-toolchain.toml)
        shell: pwsh
        run: rustup show

      # Restores the release dependencies pre-compiled on main (release-cache.yml). A tag's own
      # cache could never be reused by the next tag, so it isn't saved.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      # mozillafetch builds BoringSSL; NASM assembles its x86_64 assembly (cached with target/).
      - uses: ilammy/setup-nasm@v1

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Download B-Installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory tools | Out-Null
          gh release download $env:BI_VERSION -R ahmedanjum30/B-installer -D tools -p "bi.exe" -p "bi-setup.exe" -p "SHA256SUMS.txt"
          Push-Location tools
          foreach ($line in Get-Content SHA256SUMS.txt) {
            $hash, $name = $line -split '\s+', 2
            $name = $name.TrimStart('*')
            $actual = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $hash.ToLower()) { throw "B-Installer $name checksum mismatch" }
          }
          Pop-Location

      - name: Prepare signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_PFX }}"))
          "BANIME_SIGN_PFX=$env:RUNNER_TEMP\cert.pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build app and installer
        shell: pwsh
        env:
          BANIME_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./installer/build.ps1 -Bi "$env:GITHUB_WORKSPACE\tools\bi.exe" -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/B-Anime-Setup-${{ env.VERSION }}.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # Whether the Android signing key is configured (secrets can't gate a job directly).
  config:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.key.outputs.android }}
    steps:
      - id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "android=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::ANDROID_KEYSTORE isn't set; this release has no Android APK."; fi

  android:
    needs: config
    if: needs.config.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$conf" ] || { echo "Tag v$tag doesn't match tauri.conf.json version $conf"; exit 1; }
          fi
          echo "VERSION=$conf" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner has the SDK; this only sets up sdkmanager and accepts the licences. (The
      # action's default also asks for the long-removed "tools" package, which fails.)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android NDK and platform
        run: |
          # API 37's platform package is named with its minor version.
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # rquickjs generates its QuickJS bindings for Android with bindgen (libclang), against the
      # NDK's headers.
      - name: libclang for bindgen
        run: |
          sudo apt-get install -y -qq libclang-dev > /dev/null
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"

      - name: Rust with the Android target
        run: |
          rustup show
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Stray CR/LF/spaces (a secret set from Windows) would make base64 refuse the input.
          printf '%s' "$KEYSTORE" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$PASSWORD
          keyAlias=$ALIAS
          keyPassword=$PASSWORD
          EOF

      - name: Build the APK (arm64-v8a)
        working-directory: app
        run: npx tauri android build --target aarch64 --apk

      - name: Check the signature and name the APK
        run: |
          apk=app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
          mkdir -p dist && cp "$apk" "dist/B-Anime-$VERSION-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/B-Anime-${{ env.VERSION }}-arm64.apk
          if-no-files-found: error

  # One release with every platform's file. Windows is required; Android joins when it built.
  publish:
    needs: [windows, android]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd dist
          files=("B-Anime-Setup-$version.exe")
          apk="B-Anime-$version-arm64.apk"
          if [ -f "$apk" ]; then
            # The Windows checksum file may lack a final newline.
            [ -z "$(tail -c1 SHA256SUMS.txt)" ] || echo >> SHA256SUMS.txt
            sha256sum "$apk" >> SHA256SUMS.txt
            files+=("$apk")
          else
            echo "::warning::No Android APK in this release."
          fi
          files+=(SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${files[@]}" -R "$GITHUB_REPOSITORY" \
            --title "B-Anime $version" --generate-notes

  # The website (site/) on GitHub Pages, with this release's downloads at fixed links:
  # https://ahmedanjum30.github.io/B-Anime/download/B-Anime-Setup.exe and .../B-Anime-arm64.apk
  pages:
    needs: publish
    runs-on: ubuntu-latest
    # One writer to gh-pages at a time (site.yml uses the same group).
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the site and downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-site.sh "${GITHUB_REF_NAME#v}" release
