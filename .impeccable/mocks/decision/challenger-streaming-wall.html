<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>B-Anime — Streaming Title Wall</title>
<style>
:root{--k0:#0E0F12;--k1:#1A1C21;--k2:#26282F;--k6:#8A8D98;--k10:#F4F4F5;--acc:#E8C547}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--k0);color:var(--k10);font:14px/20px system-ui,"Segoe UI",sans-serif}
header{height:64px;display:flex;align-items:center;gap:32px;padding:0 48px}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--acc)}
header a{color:var(--k6);text-decoration:none;font-weight:600}header a.on{color:var(--k10)}
.search{margin-left:auto;width:280px;height:36px;border-radius:6px;background:var(--k1);padding:8px 12px;color:var(--k6)}
section{padding:0 48px;margin-top:24px}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
.rail{display:flex;gap:12px}
.tile{flex:0 0 216px;height:122px;border-radius:6px;position:relative;opacity:.55}
.rail.active .tile{opacity:1}
.tile.focus{flex-basis:340px;height:190px;margin-top:-34px;box-shadow:0 0 0 2px var(--acc),0 18px 40px rgba(0,0,0,.6);opacity:1}
.tile.focus .info{position:absolute;left:16px;right:16px;bottom:14px}
.info b{display:block;font-size:17px}.info span{color:#d6d7db;font-size:13px}
.info .bar{height:3px;background:rgba(255,255,255,.25);margin-top:8px}.info .bar i{display:block;height:3px;width:61%;background:var(--acc)}
.poster{flex:0 0 150px;height:225px;border-radius:6px;opacity:.55}
</style></head><body>
<header><div class="logo">B<b>.</b>ANIME</div><a class="on" href="#">Home</a><a href="#">Library</a><a href="#">Schedule</a><a href="#">Manga</a><a href="#">Discover</a><div class="search">Search</div></header>
<section style="margin-top:64px"><h2>Continue watching</h2>
<div class="rail active">
<div class="tile focus" style="background:linear-gradient(160deg,#4b6f86,#18232c)"><div class="info"><b>Frieren: Beyond Journey's End</b><span>S2 · Ep 18 · New · 24 min</span><div class="bar"><i></i></div></div></div>
<div class="tile" style="background:linear-gradient(160deg,#7a3a3a,#241212)"></div>
<div class="tile" style="background:linear-gradient(160deg,#55507e,#1b1930)"></div>
<div class="tile" style="background:linear-gradient(160deg,#43765c,#142619)"></div>
<div class="tile" style="background:linear-gradient(160deg,#7d6a3a,#2a2210)"></div>
</div></section>
<section><h2>Airing this week</h2>
<div class="rail">
<div class="poster" style="background:#3a5a7d"></div><div class="poster" style="background:#5a3a5a"></div><div class="poster" style="background:#3a5a4a"></div><div class="poster" style="background:#6a5a3a"></div><div class="poster" style="background:#4a3a6a"></div><div class="poster" style="background:#3a4a5a"></div><div class="poster" style="background:#5a4a4a"></div><div class="poster" style="background:#2a4a5a"></div>
</div></section>
<section><h2>Your library</h2>
<div class="rail"><div class="poster" style="background:#33465a"></div><div class="poster" style="background:#5a3333"></div><div class="poster" style="background:#3f3a5c"></div><div class="poster" style="background:#2f4f3f"></div><div class="poster" style="background:#5c4f2f"></div><div class="poster" style="background:#2f3f5c"></div><div class="poster" style="background:#4f2f4f"></div><div class="poster" style="background:#3a3a3a"></div></div></section>
</body></html>
